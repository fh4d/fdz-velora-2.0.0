<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDZ Veue — Admin</title>
<style>
/* ── Reset ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ── Tokens ─────────────────────────────────────────────────────────────────── */
:root {
  --bg:        #0a0a0a;
  --surface:   #111111;
  --surface2:  #1a1a1a;
  --border:    #262626;
  --accent:    #fe3f01;
  --text:      #e5e5e5;
  --muted:     #737373;
  --muted2:    #525252;
  --green:     #4ade80;
  --green-bg:  #052e16;
  --green-bd:  #166534;
  --red:       #f87171;
  --red-bg:    #2d0a0a;
  --red-bd:    #7f1d1d;
  --yellow:    #facc15;
  --yellow-bg: #1c1a05;
  --yellow-bd: #854d0e;
  --sidebar-w: 220px;
}

/* ── Layout ─────────────────────────────────────────────────────────────────── */
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

/* Login */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 40px; width: 100%; max-width: 400px;
}

/* App shell */
#app-shell { display: none; height: 100vh; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w); background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 24px 0;
}
.sidebar-logo { padding: 0 20px 24px; border-bottom: 1px solid var(--border); }
.sidebar-logo .brand { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.sidebar-logo .site  { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 2px; }
nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--muted);
  border: none; background: none; width: 100%; text-align: left;
  transition: background 0.12s, color 0.12s;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--surface2); color: var(--text); }
.nav-item .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border); flex-shrink: 0;
}
.nav-item.active .dot { background: var(--accent); }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.logout-btn {
  font-size: 12px; color: var(--muted2); cursor: pointer;
  border: none; background: none; padding: 0; font-family: inherit;
}
.logout-btn:hover { color: var(--text); }

.main-content {
  margin-left: var(--sidebar-w);
  height: 100vh; overflow-y: auto;
  padding: 32px 40px;
}

/* ── Sections ────────────────────────────────────────────────────────────────── */
.section { display: none; max-width: 960px; }
.section.active { display: block; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
.section-header h1 { font-size: 20px; font-weight: 700; }

/* ── Buttons ─────────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: 8px; font-size: 13px;
  font-weight: 600; cursor: pointer; border: none;
  transition: opacity 0.15s, background 0.15s;
  font-family: inherit;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary   { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--border); }
.btn-danger    { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bd); }
.btn-danger:hover:not(:disabled) { opacity: 0.8; }
.btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; }

/* ── Form panel ──────────────────────────────────────────────────────────────── */
.form-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px; margin-bottom: 32px;
  display: none;
}
.form-panel.visible { display: block; }
.form-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.form-panel-header h2 { font-size: 15px; font-weight: 700; }
.form-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted2);
  margin: 22px 0 14px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.field .hint { font-size: 11px; color: var(--muted2); margin-top: 4px; }
input[type="text"], input[type="url"], input[type="number"],
input[type="password"], textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; font-size: 13px;
  color: var(--text); font-family: inherit; outline: none;
  transition: border-color 0.15s; resize: vertical;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { min-height: 100px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.form-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

/* Image preview */
.img-preview {
  margin-top: 8px; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--border); display: none; height: 140px;
}
.img-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Tag chip input */
.tag-input-wrapper {
  display: flex; flex-wrap: wrap; gap: 6px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; min-height: 42px;
  align-items: center; cursor: text; transition: border-color 0.15s;
}
.tag-input-wrapper:focus-within { border-color: var(--accent); }
.tag-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--text);
}
.tag-chip button {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  display: flex; align-items: center;
}
.tag-chip button:hover { color: var(--red); }
.tag-text-input {
  flex: 1; min-width: 80px; background: none; border: none;
  outline: none; font-size: 13px; color: var(--text);
  font-family: inherit; padding: 2px 0;
}

/* ── Table ────────────────────────────────────────────────────────────────────── */
.table-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.table-empty { padding: 40px; text-align: center; color: var(--muted2); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 11px 16px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted2);
  border-bottom: 1px solid var(--border); background: var(--surface2);
}
td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.015); }
.td-actions { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.cell-title { font-weight: 500; }
.cell-meta  { color: var(--muted); font-size: 12px; }

/* ── Badges ──────────────────────────────────────────────────────────────────── */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
}
.badge-published { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
.badge-draft     { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-bd); }
.badge-static    { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.badge-mongo     { background: #0a1628; color: #60a5fa; border: 1px solid #1e3a5f; }

/* ── Messages ────────────────────────────────────────────────────────────────── */
.msg { padding: 11px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
.msg.success { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
.msg.error   { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-bd); }
.msg.show    { display: block; }

/* Login card extras */
.login-card .brand { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.login-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 28px; }
</style>
</head>
<body>

<!-- ── Login ───────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand">FDZ Veue</div>
    <h1>Admin Panel</h1>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pw-input" placeholder="Enter admin password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;padding:12px;">Sign In</button>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<!-- ── App shell ────────────────────────────────────────────────────────────── -->
<div id="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="brand">FDZ Veue</div>
      <div class="site">Admin Panel</div>
    </div>
    <nav>
      <button class="nav-item active" data-section="blog">
        <span class="dot"></span>Blog Posts
      </button>
      <button class="nav-item" data-section="cs">
        <span class="dot"></span>Case Studies
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <div class="main-content">

    <!-- ══ BLOG ══════════════════════════════════════════════════════════════ -->
    <div id="section-blog" class="section active">
      <div class="section-header">
        <h1>Blog Posts</h1>
        <button class="btn btn-primary" id="blog-new-btn">+ New Post</button>
      </div>

      <div class="form-panel" id="blog-form-panel">
        <div class="form-panel-header">
          <h2 id="blog-form-heading">New Blog Post</h2>
          <button class="btn btn-secondary btn-sm" id="blog-cancel-btn">Cancel</button>
        </div>

        <div class="field">
          <label>Title *</label>
          <input type="text" id="b-title" placeholder="How to Build a Brand That Lasts">
        </div>
        <div class="field">
          <label>Slug *</label>
          <input type="text" id="b-slug" placeholder="how-to-build-a-brand-that-lasts">
          <div class="hint">URL: /blog/your-slug</div>
        </div>
        <div class="field">
          <label>Excerpt</label>
          <input type="text" id="b-excerpt" placeholder="Short summary shown on the listing page">
        </div>
        <div class="field">
          <label>Cover Image URL</label>
          <input type="url" id="b-cover" placeholder="https://...">
          <div class="img-preview" id="b-cover-preview"><img alt=""></div>
        </div>
        <div class="field">
          <label>Content *</label>
          <textarea id="b-content" style="min-height:180px;" placeholder="Write your post here...&#10;&#10;## Heading&#10;&#10;Plain text or basic HTML accepted."></textarea>
        </div>
        <div class="form-section-label">SEO (optional)</div>
        <div class="row-2">
          <div class="field">
            <label>SEO Title</label>
            <input type="text" id="b-seo-title" placeholder="Overrides page title">
          </div>
          <div class="field">
            <label>SEO Description</label>
            <input type="text" id="b-seo-desc" placeholder="Overrides meta description">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="b-publish-btn">Publish</button>
          <button class="btn btn-secondary" id="b-draft-btn">Save as Draft</button>
        </div>
        <div class="msg" id="blog-msg"></div>
        <input type="hidden" id="b-editing-slug">
      </div>

      <div class="table-wrap" id="blog-table"></div>
    </div>

    <!-- ══ CASE STUDIES ══════════════════════════════════════════════════════ -->
    <div id="section-cs" class="section">
      <div class="section-header">
        <h1>Case Studies</h1>
        <button class="btn btn-primary" id="cs-new-btn">+ New Case Study</button>
      </div>

      <div class="form-panel" id="cs-form-panel">
        <div class="form-panel-header">
          <h2 id="cs-form-heading">New Case Study</h2>
          <button class="btn btn-secondary btn-sm" id="cs-cancel-btn">Cancel</button>
        </div>

        <div class="form-section-label">Identity</div>
        <div class="field">
          <label>Title *</label>
          <input type="text" id="cs-title" placeholder="Nexlify SaaS">
        </div>
        <div class="field">
          <label>Slug *</label>
          <input type="text" id="cs-slug" placeholder="nexlify-saas">
          <div class="hint">URL: /case-studies/your-slug</div>
        </div>
        <div class="field">
          <label>Subtitle *</label>
          <input type="text" id="cs-subtitle" placeholder="One-sentence description of the project">
        </div>

        <div class="form-section-label">Results</div>
        <div class="row-2">
          <div class="field"><label>Stat 1 Value *</label><input type="text" id="cs-s1v" placeholder="+185%"></div>
          <div class="field"><label>Stat 1 Label *</label><input type="text" id="cs-s1l" placeholder="Qualified Leads"></div>
        </div>
        <div class="row-2">
          <div class="field"><label>Stat 2 Value *</label><input type="text" id="cs-s2v" placeholder="+78%"></div>
          <div class="field"><label>Stat 2 Label *</label><input type="text" id="cs-s2l" placeholder="Demo Bookings"></div>
        </div>

        <div class="form-section-label">Media &amp; SEO</div>
        <div class="row-2">
          <div class="field">
            <label>Hero Image URL</label>
            <input type="url" id="cs-hero-img" placeholder="https://framerusercontent.com/...">
            <div class="img-preview" id="cs-hero-preview"><img alt=""></div>
          </div>
          <div class="field">
            <label>Client Logo URL</label>
            <input type="url" id="cs-logo" placeholder="https://framerusercontent.com/...">
            <div class="img-preview" id="cs-logo-preview"><img alt=""></div>
          </div>
        </div>
        <div class="row-2">
          <div class="field"><label>SEO Title</label><input type="text" id="cs-seo-title" placeholder="Overrides page title"></div>
          <div class="field"><label>SEO Description</label><input type="text" id="cs-seo-desc" placeholder="Overrides meta description"></div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" id="cs-publish-btn">Publish</button>
          <button class="btn btn-secondary" id="cs-draft-btn">Save as Draft</button>
        </div>
        <div class="msg" id="cs-msg"></div>
        <input type="hidden" id="cs-editing-slug">
        <input type="hidden" id="cs-editing-id">
      </div>

      <div class="table-wrap" id="cs-table"></div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  var ORIGIN   = window.location.origin;
  var BLOG_API = ORIGIN + '/admin/posts';
  var CS_API   = ORIGIN + '/api/case-studies';
  var pw = '';

  // ── Tiny helpers ──────────────────────────────────────────────────────────────

  function $(id) { return document.getElementById(id); }

  function showMsg(id, text, type) {
    var el = $(id);
    el.textContent = text;
    el.className = 'msg ' + type + ' show';
  }
  function hideMsg(id) { $(id).className = 'msg'; }

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
  }

  function authHdr() {
    return { 'Content-Type': 'application/json', 'x-admin-password': pw };
  }

  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function badgeStatus(s) {
    return '<span class="badge badge-' + s + '">' + s + '</span>';
  }
  function badgeSource(s) {
    return '<span class="badge badge-' + s + '">' + s + '</span>';
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
    catch(e) { return '—'; }
  }

  // ── Image URL preview ─────────────────────────────────────────────────────────

  function bindImgPreview(inputId, previewId) {
    $(inputId).addEventListener('input', function () {
      var wrap = $(previewId);
      var img  = wrap.querySelector('img');
      var url  = this.value.trim();
      if (!url) { wrap.style.display = 'none'; return; }
      img.src = url;
      img.onload  = function () { wrap.style.display = 'block'; };
      img.onerror = function () { wrap.style.display = 'none'; };
    });
  }

  // ── Sidebar navigation ────────────────────────────────────────────────────────

  document.querySelectorAll('.nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = this.dataset.section;
      document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.section').forEach(function (s) { s.classList.remove('active'); });
      this.classList.add('active');
      $('section-' + id).classList.add('active');
    });
  });

  // ── Login / logout ────────────────────────────────────────────────────────────

  $('pw-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('login-btn').click();
  });

  $('login-btn').addEventListener('click', function () {
    var val = $('pw-input').value.trim();
    if (!val) { showMsg('login-msg','Enter your password','error'); return; }

    var btn = this;
    btn.disabled = true; btn.textContent = 'Signing in…';

    // Auth probe: POST a guaranteed-to-conflict body so 401 = wrong pw, anything else = authed
    fetch(BLOG_API, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-admin-password': val },
      body: JSON.stringify({ title:'__auth__', slug:'__auth__', content:'__auth__' }),
    }).then(function (r) {
      btn.disabled = false; btn.textContent = 'Sign In';
      if (r.status === 401) { showMsg('login-msg','Incorrect password','error'); return; }
      pw = val;
      $('login-screen').style.display = 'none';
      $('app-shell').style.display    = 'flex';
      loadBlog(); loadCaseStudies();
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Sign In';
      showMsg('login-msg','Could not connect to server','error');
    });
  });

  $('logout-btn').addEventListener('click', function () {
    pw = '';
    $('app-shell').style.display    = 'none';
    $('login-screen').style.display = 'flex';
    $('pw-input').value = '';
  });

  // ══════════════════════════════════════════════════════════════════════════════
  // BLOG
  // ══════════════════════════════════════════════════════════════════════════════

  $('b-title').addEventListener('input', function () {
    if (!$('b-editing-slug').value) $('b-slug').value = slugify(this.value);
  });
  bindImgPreview('b-cover', 'b-cover-preview');

  function clearBlogForm() {
    ['b-title','b-slug','b-excerpt','b-cover','b-content','b-seo-title','b-seo-desc'].forEach(function(id){ $(id).value=''; });
    $('b-editing-slug').value = '';
    $('b-cover-preview').style.display = 'none';
    $('blog-form-heading').textContent = 'New Blog Post';
    $('b-publish-btn').textContent = 'Publish';
    $('b-draft-btn').textContent   = 'Save as Draft';
    hideMsg('blog-msg');
  }

  $('blog-new-btn').addEventListener('click', function () {
    clearBlogForm();
    showPanel('blog-form-panel');
  });
  $('blog-cancel-btn').addEventListener('click', function () {
    $('blog-form-panel').classList.remove('visible'); clearBlogForm();
  });

  function showPanel(id) {
    var p = $(id);
    p.classList.add('visible');
    p.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function submitBlog(status) {
    var editing = $('b-editing-slug').value;
    var payload = {
      title:          $('b-title').value.trim(),
      slug:           $('b-slug').value.trim(),
      content:        $('b-content').value.trim(),
      excerpt:        $('b-excerpt').value.trim(),
      coverImage:     $('b-cover').value.trim(),
      seoTitle:       $('b-seo-title').value.trim(),
      seoDescription: $('b-seo-desc').value.trim(),
      status:         status,
    };

    if (!payload.title)               { showMsg('blog-msg','Title is required','error'); return; }
    if (!payload.content)             { showMsg('blog-msg','Content is required','error'); return; }
    if (!editing && !payload.slug)    { showMsg('blog-msg','Slug is required','error'); return; }

    var btn = status === 'published' ? $('b-publish-btn') : $('b-draft-btn');
    btn.disabled = true;

    var url = editing ? BLOG_API + '/' + editing : BLOG_API;
    fetch(url, { method: editing ? 'PUT' : 'POST', headers: authHdr(), body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function(d){ return {ok:r.ok, s:r.status, d:d}; }); })
      .then(function (res) {
        btn.disabled = false;
        if (res.ok || res.s === 201) {
          showMsg('blog-msg', editing ? 'Post updated.' : 'Post created.', 'success');
          setTimeout(function(){ $('blog-form-panel').classList.remove('visible'); clearBlogForm(); }, 800);
          loadBlog();
        } else {
          showMsg('blog-msg', res.d.error || 'Something went wrong', 'error');
        }
      }).catch(function(){ btn.disabled=false; showMsg('blog-msg','Could not connect','error'); });
  }

  $('b-publish-btn').addEventListener('click', function(){ submitBlog('published'); });
  $('b-draft-btn').addEventListener('click',   function(){ submitBlog('draft'); });

  function loadBlog() {
    $('blog-table').innerHTML = '<div class="table-empty">Loading…</div>';
    fetch(ORIGIN + '/api/blog')
      .then(function(r){ return r.json(); })
      .then(function(res){ renderBlogTable(res.data || []); })
      .catch(function(){ $('blog-table').innerHTML='<div class="table-empty">Failed to load.</div>'; });
  }

  function renderBlogTable(posts) {
    if (!posts.length) { $('blog-table').innerHTML='<div class="table-empty">No posts yet.</div>'; return; }
    var rows = posts.map(function(p){
      var status = p.status || 'published';
      var slug   = esc(p.slug);
      var data   = esc(JSON.stringify(p));
      return '<tr>'+
        '<td class="cell-title">'+esc(p.title)+'</td>'+
        '<td>'+badgeStatus(status)+'</td>'+
        '<td class="cell-meta">'+fmtDate(p.createdAt)+'</td>'+
        '<td class="td-actions">'+
          '<button class="btn btn-secondary btn-sm" onclick="editBlog(\''+data+'\')">Edit</button>'+
          '<button class="btn btn-secondary btn-sm" onclick="toggleBlog(\''+slug+'\',this)">'+(status==='published'?'Unpublish':'Publish')+'</button>'+
          '<button class="btn btn-danger btn-sm" onclick="delBlog(\''+slug+'\',this)">Delete</button>'+
        '</td>'+
      '</tr>';
    }).join('');
    $('blog-table').innerHTML='<table><thead><tr><th>Title</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  window.editBlog = function(dataStr){
    var p = JSON.parse(dataStr);
    clearBlogForm();
    $('b-title').value    = p.title   || '';
    $('b-slug').value     = p.slug    || '';
    $('b-excerpt').value  = p.excerpt || '';
    $('b-cover').value    = p.coverImage || '';
    $('b-content').value  = p.content || '';
    $('b-seo-title').value= p.seoTitle || '';
    $('b-seo-desc').value = p.seoDescription || '';
    $('b-editing-slug').value = p.slug;
    $('blog-form-heading').textContent = 'Edit Post';
    $('b-publish-btn').textContent = 'Update & Publish';
    $('b-draft-btn').textContent   = 'Update as Draft';
    if (p.coverImage) { var prev=$('b-cover-preview'); prev.querySelector('img').src=p.coverImage; prev.style.display='block'; }
    showPanel('blog-form-panel');
  };

  window.toggleBlog = function(slug, btn){
    btn.disabled=true;
    fetch(BLOG_API+'/'+slug+'/status',{method:'PATCH',headers:authHdr()})
      .then(function(){ loadBlog(); }).catch(function(){ btn.disabled=false; });
  };

  window.delBlog = function(slug, btn){
    if(!confirm('Delete "'+slug+'"? This cannot be undone.')) return;
    btn.disabled=true;
    fetch(BLOG_API+'/'+slug,{method:'DELETE',headers:authHdr()})
      .then(function(){ loadBlog(); }).catch(function(){ btn.disabled=false; });
  };

  // ══════════════════════════════════════════════════════════════════════════════
  // CASE STUDIES
  // ══════════════════════════════════════════════════════════════════════════════

  $('cs-title').addEventListener('input', function(){
    if (!$('cs-editing-slug').value) $('cs-slug').value = slugify(this.value);
  });
  bindImgPreview('cs-hero-img', 'cs-hero-preview');
  bindImgPreview('cs-logo', 'cs-logo-preview');

  function clearCsForm(){
    ['cs-title','cs-slug','cs-subtitle',
     'cs-s1v','cs-s1l','cs-s2v','cs-s2l',
     'cs-hero-img','cs-logo','cs-seo-title','cs-seo-desc'].forEach(function(id){ $(id).value=''; });
    $('cs-editing-slug').value='';
    $('cs-editing-id').value='';
    $('cs-hero-preview').style.display='none';
    $('cs-logo-preview').style.display='none';
    $('cs-form-heading').textContent = 'New Case Study';
    $('cs-publish-btn').textContent = 'Publish';
    $('cs-draft-btn').textContent   = 'Save as Draft';
    hideMsg('cs-msg');
  }

  $('cs-new-btn').addEventListener('click', function(){ clearCsForm(); showPanel('cs-form-panel'); });
  $('cs-cancel-btn').addEventListener('click', function(){ $('cs-form-panel').classList.remove('visible'); clearCsForm(); });

  function submitCs(status){
    var editingSlug = $('cs-editing-slug').value;
    var editingId   = $('cs-editing-id').value;
    var payload = {
      title:           $('cs-title').value.trim(),
      slug:            $('cs-slug').value.trim(),
      subtitle:        $('cs-subtitle').value.trim(),
      stats: [
        { value: $('cs-s1v').value.trim(), label: $('cs-s1l').value.trim() },
        { value: $('cs-s2v').value.trim(), label: $('cs-s2l').value.trim() },
      ],
      heroImage:       $('cs-hero-img').value.trim()   || undefined,
      logo:            $('cs-logo').value.trim()       || undefined,
      seoTitle:        $('cs-seo-title').value.trim()  || undefined,
      seoDescription:  $('cs-seo-desc').value.trim()   || undefined,
      status:          status,
    };

    if (!payload.title)           { showMsg('cs-msg','Title is required','error'); return; }
    if (!payload.subtitle)        { showMsg('cs-msg','Subtitle is required','error'); return; }
    if (!payload.stats[0].value || !payload.stats[0].label ||
        !payload.stats[1].value || !payload.stats[1].label) {
      showMsg('cs-msg','Both stats need a value and a label','error'); return;
    }

    var btn = status==='published' ? $('cs-publish-btn') : $('cs-draft-btn');
    btn.disabled=true;

    // PUT uses MongoDB _id per spec; POST uses base endpoint
    var url    = editingId ? CS_API + '/' + editingId : CS_API;
    var method = editingId ? 'PUT' : 'POST';
    fetch(url, { method: method, headers: authHdr(), body: JSON.stringify(payload) })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,s:r.status,d:d}; }); })
      .then(function(res){
        btn.disabled=false;
        if (res.ok || res.s===201){
          showMsg('cs-msg', editingId?'Case study updated.':'Case study created.','success');
          setTimeout(function(){ $('cs-form-panel').classList.remove('visible'); clearCsForm(); }, 800);
          loadCaseStudies();
        } else {
          showMsg('cs-msg', res.d.error||'Something went wrong','error');
        }
      }).catch(function(){ btn.disabled=false; showMsg('cs-msg','Could not connect','error'); });
  }

  $('cs-publish-btn').addEventListener('click', function(){ submitCs('published'); });
  $('cs-draft-btn').addEventListener('click',   function(){ submitCs('draft'); });

  function loadCaseStudies(){
    $('cs-table').innerHTML='<div class="table-empty">Loading…</div>';
    fetch(CS_API+'/admin/list', { headers:{'x-admin-password':pw} })
      .then(function(r){ return r.json(); })
      .then(function(res){ renderCsTable(res.data||[]); })
      .catch(function(){ $('cs-table').innerHTML='<div class="table-empty">Failed to load.</div>'; });
  }

  function renderCsTable(studies){
    if (!studies.length){ $('cs-table').innerHTML='<div class="table-empty">No case studies yet.</div>'; return; }
    var rows = studies.map(function(cs){
      var slug = esc(cs.slug);
      var id   = esc(cs._id);
      return '<tr>'+
        '<td class="cell-title">'+esc(cs.title)+'</td>'+
        '<td class="cell-meta">'+fmtDate(cs.createdAt)+'</td>'+
        '<td>'+badgeStatus(cs.status)+'</td>'+
        '<td class="td-actions">'+
          '<button class="btn btn-secondary btn-sm" onclick="editCs(\''+slug+'\')">Edit</button>'+
          '<button class="btn btn-secondary btn-sm" onclick="toggleCs(\''+slug+'\',this)">'+(cs.status==='published'?'Unpublish':'Publish')+'</button>'+
          '<button class="btn btn-danger btn-sm" onclick="delCs(\''+id+'\',\''+slug+'\',this)">Delete</button>'+
        '</td>'+
      '</tr>';
    }).join('');
    $('cs-table').innerHTML='<table><thead><tr><th>Title</th><th>Created</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  window.editCs = function(slug){
    fetch(CS_API+'/admin/'+slug, { headers:{'x-admin-password':pw} })
      .then(function(r){ return r.json(); })
      .then(function(res){
        var s = res.data;
        clearCsForm();
        $('cs-title').value    = s.title    || '';
        $('cs-slug').value     = s.slug     || '';
        $('cs-subtitle').value = s.subtitle || '';
        if (s.stats && s.stats[0]){ $('cs-s1v').value=s.stats[0].value||''; $('cs-s1l').value=s.stats[0].label||''; }
        if (s.stats && s.stats[1]){ $('cs-s2v').value=s.stats[1].value||''; $('cs-s2l').value=s.stats[1].label||''; }
        $('cs-hero-img').value   = s.heroImage      || '';
        $('cs-logo').value       = s.logo           || '';
        $('cs-seo-title').value  = s.seoTitle       || '';
        $('cs-seo-desc').value   = s.seoDescription || '';
        $('cs-editing-slug').value = s.slug;
        $('cs-editing-id').value   = s._id;
        $('cs-form-heading').textContent = 'Edit — '+s.title;
        $('cs-publish-btn').textContent = 'Update & Publish';
        $('cs-draft-btn').textContent   = 'Update as Draft';
        if (s.heroImage){ var hp=$('cs-hero-preview'); hp.querySelector('img').src=s.heroImage; hp.style.display='block'; }
        if (s.logo){ var lp=$('cs-logo-preview'); lp.querySelector('img').src=s.logo; lp.style.display='block'; }
        showPanel('cs-form-panel');
      });
  };

  window.toggleCs = function(slug, btn){
    btn.disabled=true;
    fetch(CS_API+'/'+slug+'/status',{method:'PATCH',headers:authHdr()})
      .then(function(){ loadCaseStudies(); }).catch(function(){ btn.disabled=false; });
  };

  window.delCs = function(id, slug, btn){
    if(!confirm('Delete "'+slug+'"? This cannot be undone.')) return;
    btn.disabled=true;
    fetch(CS_API+'/'+id,{method:'DELETE',headers:authHdr()})
      .then(function(){ loadCaseStudies(); }).catch(function(){ btn.disabled=false; });
  };

})();
</script>
</body>
</html>
